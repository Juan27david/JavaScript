<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let letra = prompt("Escriba una letra cualquiera :").toLocaleLowerCase();

        switch(letra){
            case ("a" ||"e" ||"i" ||"o" ||"u"):
            alert("La letra "+letra+ " es una vocal");
            break;
            default:
            alert("la letra " + letra+" es una consonate");
        }
    </script>
</body>
</html>
