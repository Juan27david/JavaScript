<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //muestra un menú con 4 opciones numeradas
        let menu = parseInt(prompt("Escriba un número del 1 al 4 pra elejir el menú "));

        switch(menu){
            case 1:
            alert("Hamburguesa Valor -> $15.000")
            break;
            case 2:
            alert("Pizza Valor -> $12.000")
            break;
            case 3:
            alert("Perro caliente Valor -> $10.000")
            break;
            case 4:
            alert("Ensalada Valor -> $8.000")
            break;
            default:
            alert("El número escojido no corresponde a níngun menú")
        }
    </script>
</body>
</html>
