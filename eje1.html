<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = parseInt(prompt("Ingrese un número de 1 al 7 :"));

        switch(num) {
        case 1:
        alert("El"+ num +"es lunes");
        break;
        case 2:
        alert("El"+ num +"es martes");
        break;  
        case 3:
        alert("El"+ num +"es miércoles");
        break;
        case 4:
        alert("El"+ num +"es jueves");
        break;
        case 5:
        alert("El"+ num +"es viernes");
        break;
        case 6:
        alert("El"+ num +"es sábado");
        break;
        case 7:
        alert("El"+ num +"es domingo");
        break;
        default:
        alert("El número ingresado no corresponde a un día de la semana");

        }


    </script>
</body>
</html>
